<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write Blog - Blog Page</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/editor.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">Blog Page</a>
        <div class="nav-links" id="nav-links">
            <!-- Populated by JS -->
        </div>
    </nav>
    
    <div class="container" style="padding-top: 3rem;">
        <div class="editor-container">
            <h1 id="editor-page-title" style="margin-bottom: 2rem; font-size: 2.2rem;">Write a New Post</h1>
            <div id="alert"></div>
            
            <form id="editor-form">
                <div class="form-group">
                    <label for="image">Blog Cover Photo (Optional)</label>
                    <input type="file" id="image" name="image" class="form-control" accept="image/*" style="font-size: 1rem; padding: 0.5rem;">
                    <div id="current-image-preview" style="display: none; margin-top: 1rem;">
                        <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem;">Current Image:</p>
                        <img id="preview-img" src="" alt="Current Cover" style="max-height: 150px; border-radius: 4px; border: 1px solid var(--border-color);">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-control" style="font-size: 1rem; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-color); color: var(--text-main);" required>
                        <option value="General">General</option>
                        <option value="Technology">Technology</option>
                        <option value="Design">Design</option>
                        <option value="Writing">Writing</option>
                        <option value="Lifestyle">Lifestyle</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" class="form-control" style="font-size: 1.5rem; font-weight: bold; font-family: 'Playfair Display', serif;" placeholder="Enter your blog title here..." required>
                </div>
                <div class="form-group">
                    <label for="content">Content (Markdown supported)</label>
                    <textarea id="content" name="content" class="form-control editor-textarea" placeholder="Start writing your story here..." required></textarea>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 2rem; align-items: center;">
                    <button type="submit" id="submit-btn" class="btn btn-primary" style="padding: 0.8rem 2rem; font-size: 1.1rem;">Publish Post</button>
                    <a href="my-blogs.html" class="btn btn-outline" style="padding: 0.8rem 2rem; font-size: 1.1rem; text-align: center;">Cancel</a>
                </div>
            </form>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
