!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Blog Page</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">Blog Page</a>
    </nav>

    <div class="container">
        <div class="auth-container">
            <h2>Create an Account</h2>
            <p class="auth-subtitle">Please enter your details to sign up.</p>
            <div id="alert"></div>
            <form id="register-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Choose a uername" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Create apassword" required>
                </div>
                <div class=""form-group">
                     <label for="confirm_password">Confirm Password</label>
                     <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm your password" required>
                </div>
                <button type="submit" class="btn btn-primary auth-btn">Sign Up</button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem 0; color: var(--text-muted); font-size: 0.9rem; display: flex; align-items: center;">
                <hr style="flex: 1; border: none; border-top: 1px solid var(--border-color);">
                <span style="padding: 0 10px;"">or continue with </span>
                <hr style="flex: 1; border: none; border-top: 1px solid var(--border-color);">
            </div>

            <div class="social-login">
                <button type="button" class="btn-social" onclick="alert('Google login mockup')">
                  <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.04 2.26-.79 3.59-.76 1.41.04 2.54.54 3.23 1.47-2.73 1.54-2.29 5.35.48 6.55-.66 1.83-1.63 3.63-2.38 4.91zm-3.32-14.8c-.1-1.67 1.25-3.2 2.92-3.48.24 1.76-1.39 3.35-2.92 3.48z"/></svg>
                </button>
            </div>
            
            <div class="auth-links">
                Already have an account? <a href="login.html">Log In</a>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
