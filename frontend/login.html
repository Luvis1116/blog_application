<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Blog Page</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">Blog Page</a>
    </nav>
    
    <div class="container">
        <div class="auth-container">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Please enter your details to sign in.</p>
            <div id="alert"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <div style="text-align: right; margin-bottom: 1.5rem;">
                    <a href="#" style="font-size: 0.85rem; color: var(--text-muted); text-decoration: none;">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary auth-btn">Sign In</button>
            </form>
            
            <div style="text-align: center; margin: 1.5rem 0; color: var(--text-muted); font-size: 0.9rem; display: flex; align-items: center;">
                <hr style="flex: 1; border: none; border-top: 1px solid var(--border-color);">
                <span style="padding: 0 10px;">or continue with</span>
                <hr style="flex: 1; border: none; border-top: 1px solid var(--border-color);">
            </div>
            
            <div class="social-login">
                <button type="button" class="btn-social" onclick="alert('Google login mockup')">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/><path fill="none" d="M1 1h22v22H1z"/></svg>
                </button>
                <button type="button" class="btn-social" onclick="alert('Apple login mockup')">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.04 2.26-.79 3.59-.76 1.41.04 2.54.54 3.23 1.47-2.73 1.54-2.29 5.35.48 6.55-.66 1.83-1.63 3.63-2.38 4.91zm-3.32-14.8c-.1-1.67 1.25-3.2 2.92-3.48.24 1.76-1.39 3.35-2.92 3.48z"/></svg>
                </button>
            </div>
            
            <div class="auth-links">
                Don't have an account? <a href="register.html">Sign Up</a>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
